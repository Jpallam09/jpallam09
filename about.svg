<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
      * { font-family: 'JetBrains Mono', 'Courier New', monospace; }

      /* Fade in and slide from the left, used for each row */
      .row { opacity: 0; animation: slideIn 0.6s ease-out forwards; }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-14px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      /* Simple fade in */
      .fade { opacity: 0; animation: fadeIn 0.8s ease-out forwards; }
      @keyframes fadeIn { to { opacity: 1; } }

      /* Logo: fade in, then a soft glow that repeats */
      .logo { opacity: 0; animation: fadeIn 0.8s ease-out 0.1s forwards, glow 3s ease-in-out 1s infinite; }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 0 rgba(96,165,250,0)); }
        50%      { filter: drop-shadow(0 0 6px rgba(96,165,250,0.7)); }
      }

      /* Blinking cursor after the title */
      .cursor { opacity: 0; animation: blink 1s steps(1) 1s infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

      /* Status text pulses gently */
      .pulse { animation: pulse 2s ease-in-out 1.5s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

      /* Respect people who prefer less motion */
      @media (prefers-reduced-motion: reduce) {
        .row, .fade, .logo { animation: none; opacity: 1; }
        .cursor, .pulse { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#09090b"/>

  <!-- Left side: JP logo (ANSI Shadow style, verified glyphs) -->
  <text class="logo" x="40" y="60" font-size="15" letter-spacing="-1" fill="#60a5fa" xml:space="preserve">
    <tspan x="40" dy="0">     ██╗ ██████╗ </tspan>
    <tspan x="40" dy="18">     ██║ ██╔══██╗</tspan>
    <tspan x="40" dy="18">     ██║ ██████╔╝</tspan>
    <tspan x="40" dy="18">██   ██║ ██╔═══╝ </tspan>
    <tspan x="40" dy="18">╚██████║ ██║     </tspan>
    <tspan x="40" dy="18"> ╚═════╝ ╚═╝     </tspan>
  </text>

  <!-- Left side: Subtitle -->
  <g class="fade" style="animation-delay:0.5s">
    <text x="40" y="182" font-size="13" fill="#a1a1aa">John Paul Allam</text>
    <text x="40" y="200" font-size="12" fill="#52525b">Software developer</text>
  </g>
  <rect class="cursor" x="172" y="191" width="7" height="12" fill="#60a5fa"/>

  <!-- Divider line -->
  <line class="fade" style="animation-delay:0.3s" x1="280" y1="50" x2="280" y2="480" stroke="#27272a" stroke-width="1"/>

  <!-- Row 1: Role -->
  <g class="row" style="animation-delay:0.6s">
    <text x="320" y="80" font-size="14" fill="#a78bfa">Role</text>
    <text x="480" y="80" font-size="14" fill="#fafafa">Software Developer</text>
  </g>

  <!-- Row 2: Location -->
  <g class="row" style="animation-delay:0.75s">
    <text x="320" y="110" font-size="14" fill="#a78bfa">Location</text>
    <text x="480" y="110" font-size="14" fill="#fafafa">Isabela, Philippines</text>
  </g>

  <!-- Row 3: Status -->
  <g class="row" style="animation-delay:0.9s">
    <text x="320" y="140" font-size="14" fill="#a78bfa">Status</text>
    <text class="pulse" x="480" y="140" font-size="14" fill="#22c55e">Open to Opportunities</text>
  </g>

  <!-- Divider -->
  <line class="row" style="animation-delay:1.0s" x1="320" y1="162" x2="850" y2="162" stroke="#27272a" stroke-width="1"/>

  <!-- Section: Frontend -->
  <g class="row" style="animation-delay:1.1s">
    <text x="320" y="192" font-size="13" fill="#a1a1aa">Frontend</text>
    <text x="480" y="192" font-size="13" fill="#86efac">Next.js</text>
    <text x="600" y="192" font-size="13" fill="#86efac">TypeScript</text>
    <text x="730" y="192" font-size="13" fill="#86efac">React</text>
  </g>
  <g class="row" style="animation-delay:1.2s">
    <text x="480" y="216" font-size="13" fill="#86efac">Tailwind CSS</text>
    <text x="630" y="216" font-size="13" fill="#86efac">shadcn/ui</text>
  </g>

  <!-- Divider -->
  <line class="row" style="animation-delay:1.3s" x1="320" y1="240" x2="850" y2="240" stroke="#27272a" stroke-width="1"/>

  <!-- Section: Backend -->
  <g class="row" style="animation-delay:1.4s">
    <text x="320" y="270" font-size="13" fill="#a1a1aa">Backend</text>
    <text x="480" y="270" font-size="13" fill="#86efac">Node.js</text>
    <text x="600" y="270" font-size="13" fill="#86efac">Laravel/PHP</text>
  </g>
  <g class="row" style="animation-delay:1.5s">
    <text x="480" y="294" font-size="13" fill="#86efac">Supabase</text>
    <text x="600" y="294" font-size="13" fill="#86efac">PostgreSQL</text>
    <text x="740" y="294" font-size="13" fill="#86efac">Drizzle ORM</text>
    <text x="740" y="294" font-size="13" fill="#86efac">Prisma ORM</text>
  </g>

  <!-- Divider -->
  <line class="row" style="animation-delay:1.6s" x1="320" y1="318" x2="850" y2="318" stroke="#27272a" stroke-width="1"/>

  <!-- Section: Tools & Deployment -->
  <g class="row" style="animation-delay:1.7s">
    <text x="320" y="348" font-size="13" fill="#a1a1aa">Tools</text>
    <text x="480" y="348" font-size="13" fill="#f97316">Vercel</text>
    <text x="570" y="348" font-size="13" fill="#f97316">Opencode</text>
    <text x="690" y="348" font-size="13" fill="#f97316">VS code</text>
  </g>

  <!-- Divider -->
  <line class="row" style="animation-delay:1.8s" x1="320" y1="372" x2="850" y2="372" stroke="#27272a" stroke-width="1"/>

  <!-- Section: Specializations -->
  <g class="row" style="animation-delay:1.9s">
    <text x="320" y="402" font-size="13" fill="#a1a1aa">I like building</text>
    <text x="480" y="402" font-size="13" fill="#fbbf24">REST APIs</text>
    <text x="600" y="402" font-size="13" fill="#fbbf24">Web systems</text>
    <text x="740" y="402" font-size="13" fill="#fbbf24">Clean UI</text>
  </g>

  <!-- Divider -->
  <line class="row" style="animation-delay:2.0s" x1="320" y1="426" x2="850" y2="426" stroke="#27272a" stroke-width="1"/>
</svg>
