<svg width="900" height="520" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
      * { font-family: 'JetBrains Mono', 'Courier New', monospace; }

      /* Fade in and slide from the left, used for each row */
      .row { opacity: 0; animation: slideIn 0.6s ease-out forwards; }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-14px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      /* Simple fade in */
      .fade { opacity: 0; animation: fadeIn 0.8s ease-out forwards; }
      @keyframes fadeIn { to { opacity: 1; } }

      /* Logo: fade in, then a soft glow that repeats */
      .logo { opacity: 0; animation: fadeIn 0.8s ease-out 0.1s forwards, glow 3s ease-in-out 1s infinite; }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 0 rgba(96,165,250,0)); }
        50%      { filter: drop-shadow(0 0 6px rgba(96,165,250,0.7)); }
      }

      /* Blinking cursor after the title */
      .cursor { opacity: 0; animation: blink 1s steps(1) 1s infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

      /* Status dot with a slow ripple */
      .ring { transform-box: fill-box; transform-origin: center; animation: ripple 2.4s ease-out 1.5s infinite; }
      @keyframes ripple {
        0%   { transform: scale(1);   opacity: 0.6; }
        100% { transform: scale(2.6); opacity: 0; }
      }

      /* Respect people who prefer less motion */
      @media (prefers-reduced-motion: reduce) {
        .row, .fade, .logo { animation: none; opacity: 1; }
        .cursor { animation: none; opacity: 1; }
        .ring { animation: none; opacity: 0; }
      }
    </style>

    <!-- Soft glow behind the logo -->
    <radialGradient id="glowbg" cx="140" cy="260" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <!-- Faint dot texture -->
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#fafafa" fill-opacity="0.05"/>
    </pattern>

    <!-- Vertical divider that fades at both ends -->
    <linearGradient id="vline" x1="0" y1="40" x2="0" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f3f46" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3f3f46" stop-opacity="1"/>
      <stop offset="1" stop-color="#3f3f46" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#09090b"/>
  <rect width="900" height="520" fill="url(#dots)"/>
  <rect width="900" height="520" fill="url(#glowbg)"/>
  <rect class="fade" x="12" y="12" width="876" height="496" rx="14" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Left side: JP logo (ANSI Shadow style, verified glyphs) -->
  <text class="logo" x="40" y="194" font-size="15" letter-spacing="-1" fill="#60a5fa" xml:space="preserve">
    <tspan x="40" dy="0">     ██╗ ██████╗ </tspan>
    <tspan x="40" dy="18">     ██║ ██╔══██╗</tspan>
    <tspan x="40" dy="18">     ██║ ██████╔╝</tspan>
    <tspan x="40" dy="18">██   ██║ ██╔═══╝ </tspan>
    <tspan x="40" dy="18">╚██████║ ██║     </tspan>
    <tspan x="40" dy="18"> ╚═════╝ ╚═╝     </tspan>
  </text>

  <!-- Left side: Subtitle -->
  <g class="fade" style="animation-delay:0.5s">
    <text x="40" y="316" font-size="13" fill="#a1a1aa">John Paul Allam</text>
    <text x="40" y="334" font-size="12" fill="#52525b">Software developer</text>
  </g>
  <rect class="cursor" x="172" y="325" width="7" height="12" fill="#60a5fa"/>

  <!-- Divider line -->
  <line class="fade" style="animation-delay:0.3s" x1="280" y1="40" x2="280" y2="480" stroke="url(#vline)" stroke-width="1"/>

  <g class="row" style="animation-delay:0.6s">
    <text x="320" y="101" font-size="14" fill="#a78bfa">Role</text>
    <text x="480" y="101" font-size="14" fill="#fafafa">Software Developer</text>
  </g>
  <g class="row" style="animation-delay:0.75s">
    <text x="320" y="131" font-size="14" fill="#a78bfa">Location</text>
    <text x="480" y="131" font-size="14" fill="#fafafa">Isabela, Philippines</text>
  </g>
  <g class="row" style="animation-delay:0.9s">
    <text x="320" y="161" font-size="14" fill="#a78bfa">Status</text>
    <text x="480" y="161" font-size="14" fill="#22c55e">Open to Opportunities</text>
    <circle class="ring" cx="672" cy="156" r="3.5" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="672" cy="156" r="3.5" fill="#22c55e"/>
  </g>
  <line class="row" style="animation-delay:1.0s" x1="320" y1="183" x2="850" y2="183" stroke="#27272a" stroke-width="1"/>
  <g class="row" style="animation-delay:1.1s">
    <text x="320" y="213" font-size="13" fill="#a1a1aa">Frontend</text>
    <rect x="472" y="198" width="70.6" height="20" rx="6" fill="#86efac" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.22"/><text x="480" y="213" font-size="13" fill="#86efac">Next.js</text>
    <rect x="592" y="198" width="94.0" height="20" rx="6" fill="#86efac" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.22"/><text x="600" y="213" font-size="13" fill="#86efac">TypeScript</text>
    <rect x="722" y="198" width="55.0" height="20" rx="6" fill="#86efac" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.22"/><text x="730" y="213" font-size="13" fill="#86efac">React</text>
  </g>
  <g class="row" style="animation-delay:1.2s">
    <rect x="472" y="222" width="109.6" height="20" rx="6" fill="#86efac" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.22"/><text x="480" y="237" font-size="13" fill="#86efac">Tailwind CSS</text>
    <rect x="622" y="222" width="86.2" height="20" rx="6" fill="#86efac" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.22"/><text x="630" y="237" font-size="13" fill="#86efac">shadcn/ui</text>
  </g>
  <line class="row" style="animation-delay:1.3s" x1="320" y1="261" x2="850" y2="261" stroke="#27272a" stroke-width="1"/>
  <g class="row" style="animation-delay:1.4s">
    <text x="320" y="291" font-size="13" fill="#a1a1aa">Backend</text>
    <rect x="472" y="276" width="70.6" height="20" rx="6" fill="#86efac" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.22"/><text x="480" y="291" font-size="13" fill="#86efac">Node.js</text>
    <rect x="592" y="276" width="101.8" height="20" rx="6" fill="#86efac" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.22"/><text x="600" y="291" font-size="13" fill="#86efac">Laravel/PHP</text>
    <rect x="732" y="276" width="94.0" height="20" rx="6" fill="#86efac" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.22"/><text x="740" y="291" font-size="13" fill="#86efac">Prisma ORM</text>
  </g>
  <g class="row" style="animation-delay:1.5s">
    <rect x="472" y="300" width="78.4" height="20" rx="6" fill="#86efac" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.22"/><text x="480" y="315" font-size="13" fill="#86efac">Supabase</text>
    <rect x="592" y="300" width="94.0" height="20" rx="6" fill="#86efac" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.22"/><text x="600" y="315" font-size="13" fill="#86efac">PostgreSQL</text>
    <rect x="732" y="300" width="101.8" height="20" rx="6" fill="#86efac" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.22"/><text x="740" y="315" font-size="13" fill="#86efac">Drizzle ORM</text>
  </g>
  <line class="row" style="animation-delay:1.6s" x1="320" y1="339" x2="850" y2="339" stroke="#27272a" stroke-width="1"/>
  <g class="row" style="animation-delay:1.7s">
    <text x="320" y="369" font-size="13" fill="#a1a1aa">Tools</text>
    <rect x="472" y="354" width="62.8" height="20" rx="6" fill="#f97316" fill-opacity="0.08" stroke="#f97316" stroke-opacity="0.22"/><text x="480" y="369" font-size="13" fill="#f97316">Vercel</text>
    <rect x="562" y="354" width="78.4" height="20" rx="6" fill="#f97316" fill-opacity="0.08" stroke="#f97316" stroke-opacity="0.22"/><text x="570" y="369" font-size="13" fill="#f97316">Opencode</text>
    <rect x="682" y="354" width="70.6" height="20" rx="6" fill="#f97316" fill-opacity="0.08" stroke="#f97316" stroke-opacity="0.22"/><text x="690" y="369" font-size="13" fill="#f97316">VS code</text>
  </g>
  <line class="row" style="animation-delay:1.8s" x1="320" y1="393" x2="850" y2="393" stroke="#27272a" stroke-width="1"/>
  <g class="row" style="animation-delay:1.9s">
    <text x="320" y="423" font-size="13" fill="#a1a1aa">I like building</text>
    <rect x="472" y="408" width="86.2" height="20" rx="6" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.22"/><text x="480" y="423" font-size="13" fill="#fbbf24">REST APIs</text>
    <rect x="592" y="408" width="101.8" height="20" rx="6" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.22"/><text x="600" y="423" font-size="13" fill="#fbbf24">Web systems</text>
    <rect x="732" y="408" width="78.4" height="20" rx="6" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.22"/><text x="740" y="423" font-size="13" fill="#fbbf24">Clean UI</text>
  </g>

</svg>
